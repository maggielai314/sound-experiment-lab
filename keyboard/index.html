<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>認音鍵盤 · 聲音實驗室</title>
<style>
  :root{
    --ink:#3B2F5A; --muted:#7A6E99; --bg:#FFF7EC; --card:#FFFFFF;
    --lav:#CDB8FF; --pink:#FF9EC4; --mint:#8FE3CF; --sky:#BFE6FF;
    --white-key:#FFFFFF; --black-key:#2B2340; --hit:#B79BFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Microsoft JhengHei","PingFang HK","PingFang TC","Noto Sans TC",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none}
  body{display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:10px}
  h1{font-size:22px;margin:0 6px 0 0;white-space:nowrap}
  h1 small{font-size:13px;color:var(--muted);font-weight:600;margin-left:6px}
  .seg{display:inline-flex;background:var(--card);border-radius:999px;padding:3px;box-shadow:0 2px 0 var(--lav)}
  .seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:700;
    padding:7px 13px;border-radius:999px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--lav)}
  .vol{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
  .vol input{width:110px;accent-color:#8A6CF0}
  .readout{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;
    padding:6px 14px;min-height:44px;box-shadow:0 3px 0 var(--pink)}
  .readout span.lbl{font-size:13px;color:var(--muted);font-weight:700}
  .readout b{font-size:24px;letter-spacing:.06em;min-width:4ch}
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
  .kb{position:relative;width:100%;height:min(62vh,420px);touch-action:none;border-radius:16px;
    background:var(--ink);padding:10px 10px 12px;box-shadow:0 6px 0 #241c3a}
  .whites{position:relative;display:flex;height:100%;gap:3px}
  .key{position:relative;touch-action:none}
  .white{flex:1;background:var(--white-key);border-radius:0 0 10px 10px;display:flex;flex-direction:column;
    justify-content:flex-end;align-items:center;padding-bottom:12px;transition:background .05s}
  .white.on{background:var(--hit)}
  .black{position:absolute;top:0;height:60%;background:var(--black-key);border-radius:0 0 8px 8px;z-index:2;
    display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:8px;
    box-shadow:inset 0 -6px 0 #000a}
  .black.on{background:#8A6CF0}
  .name{font-weight:800;font-size:clamp(16px,2.8vw,30px);line-height:1}
  .deg{font-size:clamp(12px,1.6vw,17px);font-weight:800;color:#fff;background:#8A6CF0;border-radius:999px;
    min-width:1.7em;height:1.7em;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
  .bname{color:#fff;font-weight:700;font-size:clamp(9px,1.25vw,14px);line-height:1.15;text-align:center}
  .hide-names .name,.hide-names .bname{visibility:hidden}
  .hide-deg .deg{display:none}
  .oct{position:absolute;bottom:3px;font-size:10px;color:#b9b0cf}
  .hint{margin-top:12px;font-size:13px;color:var(--muted);text-align:center}
  .gate{position:fixed;inset:0;background:rgba(59,47,90,.55);display:flex;align-items:center;justify-content:center;z-index:9}
  .gate button{font:inherit;font-size:24px;font-weight:800;color:var(--ink);background:var(--mint);border:0;
    border-radius:999px;padding:18px 36px;box-shadow:0 5px 0 #3B2F5A;cursor:pointer}
  .gate[hidden]{display:none}
  .rotate{display:none}
  @media (orientation:portrait) and (max-width:820px){
    .rotate{display:block;background:var(--sky);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:700;text-align:center}
  }
</style>
</head>
<body>
<header>
  <h1>認音鍵盤<small>聲音實驗室</small></h1>
  <div class="seg" role="group" aria-label="音名">
    <button id="namesOn" aria-pressed="true">顯示音名</button>
    <button id="namesOff" aria-pressed="false">挑戰：隱藏音名</button>
  </div>
  <div class="seg" role="group" aria-label="數字">
    <button id="degOff" aria-pressed="true">冇數字</button>
    <button id="degOn" aria-pressed="false">C 大調 1–7</button>
  </div>
  <label class="vol">音量 <input id="vol" type="range" min="0" max="100" value="60"></label>
  <div class="readout" aria-live="polite"><span class="lbl">你彈緊</span><b id="now">—</b></div>
</header>
<div class="rotate">將 iPad 打橫，鍵盤會大啲</div>
<div class="stage">
  <div class="kb" id="kb"><div class="whites" id="whites"></div></div>
  <div class="hint">可以同時按幾個鍵 ・ 老師電腦：A S D F G H J K L ; 對應白鍵，W E T Y U O P 對應黑鍵</div>
</div>
<div class="gate" id="gate"><button id="start">撳呢度開始 🎹</button></div>

function b64ToBuf(b64){ const s=atob(b64), a=new Uint8Array(s.length); for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i); return a.buffer; }
async function initAudio(){

  const root = nearest(m), buf = buffers[sampleMidi[root]]; if (!buf) return;
  if (voices.has(m)) release(m, 0.03);
  const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = Math.pow(2,(m-root)/12);
  const g = ctx.createGain(); g.gain.value = 0.9; src.connect(g); g.connect(master);
  src.start(0, 0.025); voices.set(m,{src,g});
}
function release(m, t=0.35){
  const v = voices.get(m); if (!v) return; voices.delete(m);
  const now = ctx.currentTime; v.g.gain.cancelScheduledValues(now); v.g.gain.setValueAtTime(v.g.gain.value, now);
  v.g.gain.exponentialRampToValueAtTime(0.0001, now+t); v.src.stop(now+t+0.05);
}
function noteOff(m){
  const c=(held.get(m)||1)-1; if (c<=0){ held.delete(m); release(m); } else held.set(m,c); paint();
}
function label(m){ return NAMES[m%12].replace('#','♯'); }
function paint(){
  document.querySelectorAll('.key').forEach(k => k.classList.toggle('on', held.has(+k.dataset.m)));
  const t = performance.now();
  for (const [m,ts] of recent) if (t-ts>1600 && !held.has(m)) recent.delete(m);
  const list = [...new Set([...held.keys(), ...recent.keys()])].sort((a,b)=>a-b).map(label);
  const hidden = document.body.classList.contains('hide-names');
  document.getElementById('now').textContent = list.length ? (hidden ? list.map(()=>'●').join(' ') : list.join(' ')) : '—';
}
setInterval(paint, 300);

// build keys
const whites = document.getElementById('whites'), kb = document.getElementById('kb');
const whiteList = [];
for (let m=LOW; m<=HIGH; m++){
  const pc = m%12; if (BLACK_LABEL[pc]) continue;
  const d = document.createElement('div'); d.className='key white'; d.dataset.m=m;
  d.innerHTML = `<div class="deg">${DEG[pc]}</div><div class="name">${NAMES[pc]}</div>`;
  whites.appendChild(d); whiteList.push(m);
}
function placeBlacks(){
  kb.querySelectorAll('.black').forEach(e=>e.remove());
  const els = [...whites.children];
  for (let m=LOW; m<HIGH; m++){
    const pc=m%12; if (!BLACK_LABEL[pc]) continue;
    const left = els[whiteList.indexOf(m-1)], right = els[whiteList.indexOf(m+1)];
    const w = left.offsetWidth*0.62, x = (left.offsetLeft+left.offsetWidth + right.offsetLeft)/2 - w/2;
    const b = document.createElement('div'); b.className='key black'; b.dataset.m=m;
    b.style.left = (x+10)+'px'; b.style.width = w+'px'; b.style.top='10px';
    b.innerHTML = `<div class="bname">${BLACK_LABEL[pc]}</div>`;
    kb.appendChild(b);
  }
}
placeBlacks(); addEventListener('resize', placeBlacks);

// pointer handling (multi-touch)
const ptr = new Map();
function keyAt(x,y){ const el = document.elementFromPoint(x,y); const k = el && el.closest('.key'); return k ? +k.dataset.m : null; }
kb.addEventListener('pointerdown', e => {
  e.preventDefault(); const m = keyAt(e.clientX,e.clientY); if (m===null) return;
  ptr.set(e.pointerId, m); noteOn(m);
  try { kb.setPointerCapture(e.pointerId); } catch(_){}
});
kb.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return;
  const m = keyAt(e.clientX,e.clientY); const old = ptr.get(e.pointerId);
  if (m!==null && m!==old){ noteOff(old); ptr.set(e.pointerId,m); noteOn(m); }
});
function up(e){ if (!ptr.has(e.pointerId)) return; noteOff(ptr.get(e.pointerId)); ptr.delete(e.pointerId); }
['pointerup','pointercancel','lostpointercapture'].forEach(t => kb.addEventListener(t, up));
document.addEventListener('contextmenu', e => e.preventDefault());

// computer keyboard (teacher)
const KEYMAP = {a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72,o:73,l:74,p:75,';':76,"'":77};
const down = new Set();
addEventListener('keydown', e => { const m = KEYMAP[e.key.toLowerCase()]; if (m===undefined || e.repeat || down.has(e.key)) return; down.add(e.key); hideGate(); noteOn(m); });
addEventListener('keyup', e => { const m = KEYMAP[e.key.toLowerCase()]; if (m===undefined) return; down.delete(e.key); noteOff(m); });

// toggles
function seg(onId, offId, cls, invert){
  const on=document.getElementById(onId), off=document.getElementById(offId);
  const set = v => { on.setAttribute('aria-pressed',v); off.setAttribute('aria-pressed',!v); document.body.classList.toggle(cls, invert ? !v : v); };
  on.onclick = () => set(true); off.onclick = () => set(false); return set;
}
seg('namesOn','namesOff','hide-names',true)(true);
seg('degOn','degOff','hide-deg',true)(false);

const gate = document.getElementById('gate');
function hideGate(){ gate.hidden = true; initAudio(); }
document.getElementById('start').addEventListener('pointerdown', e => { e.preventDefault(); hideGate(); });
</script>
</body>
